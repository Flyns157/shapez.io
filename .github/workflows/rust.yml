name: Rust

on:
    push:
        branches: [master]
        paths: ["rust/**", ".github/workflows/rust.yml"]
    pull_request:
        paths: ["rust/**", ".github/workflows/rust.yml"]

env:
    CARGO_TERM_COLOR: always
    RUSTFLAGS: -D warnings

defaults:
    run:
        working-directory: rust

jobs:
    check:
        name: fmt, clippy, tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Dépendances système de Bevy
              run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
            - name: Toolchain (rust-toolchain.toml)
              run: rustup show active-toolchain || rustup toolchain install
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: rust
            - run: cargo fmt --all --check
            - run: cargo clippy --workspace --all-targets -- -D warnings
            - run: cargo test --workspace

    sim-only:
        name: crates sans Bevy
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - run: rustup show active-toolchain || rustup toolchain install
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: rust
            # Garantit que la simulation se compile et se teste sans Bevy.
            - run: cargo test -p shapez_core -p shapez_sim
            - name: Aucune dépendance Bevy dans la simulation
              run: "! cargo tree -p shapez_sim -e normal | grep -q bevy"

    deny:
        name: cargo deny
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: EmbarkStudios/cargo-deny-action@v2
              with:
                  manifest-path: rust/Cargo.toml
